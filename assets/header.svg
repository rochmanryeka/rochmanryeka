<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Zainu Rochman — Full-Stack Engineer</title>
  <desc id="desc">A red and charcoal banner matching ryeka.my.id, with the portfolio's original services, compute, AI, and identity illustration.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0f0e0e"/><stop offset=".55" stop-color="#1d1a1a"/><stop offset="1" stop-color="#3e1515"/>
    </linearGradient>
    <linearGradient id="banner-name" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffaaa3"/><stop offset="1" stop-color="#f16a6a"/>
    </linearGradient>
    <clipPath id="banner-clip"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#banner-clip)">
    <rect width="1200" height="380" fill="url(#banner-bg)"/>
    <rect x="0" y="0" width="5" height="380" fill="#ae0202"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <rect x="48" y="35" width="197" height="32" rx="16" fill="#252020" stroke="#4a3838"/>
      <circle cx="65" cy="51" r="4" fill="#f16a6a"/>
      <text x="79" y="56" fill="#ffb4af" font-size="14" font-weight="600">Full-Stack Engineer</text>
      <text x="48" y="118" fill="#f3f0eb" font-size="28" font-weight="600">Hi, I’m</text>
      <text x="45" y="181" fill="url(#banner-name)" font-size="58" font-weight="700" letter-spacing="-2">Zainu Rochman</text>
      <text x="48" y="232" fill="#f3efea" font-size="19">Scalable platforms. Practical AI.</text>
      <text x="48" y="260" fill="#c6bab4" font-size="19">Thoughtful engineering. Measurable impact.</text>
      <path d="M48 301h33" stroke="#ae0202" stroke-width="3" stroke-linecap="round"/>
      <text x="94" y="306" fill="#ffb4af" font-size="15">ryeka.my.id</text>
      <text x="48" y="346" fill="#c6bab4" font-size="13">GO / LARAVEL / VUE / TYPESCRIPT</text>
    </g>
